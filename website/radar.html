<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaeL Cheat - Web Radar</title>
    <style>
        body {
            margin: 0;
            background-color: #0c0d10;
            color: #fff;
            font-family: 'Inter', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #ff5e00;
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        #radar-container {
            position: relative;
            width: 400px;
            height: 400px;
            background: #15171e;
            border: 2px solid #ff5e00;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 94, 0, 0.2);
            overflow: hidden;
        }
        /* Grid Lines */
        #radar-container::before {
            content: ''; position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(255,255,255,0.1);
        }
        #radar-container::after {
            content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: rgba(255,255,255,0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .status {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9rem;
        }
        .status .connected { color: #28a745; font-weight: bold; }
        .status .disconnected { color: #dc3545; font-weight: bold; }
        .controls { margin-top: 15px; display: flex; gap: 15px; }
        .controls label { font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <h1>KaeL Web Radar</h1>
    <div id="radar-container">
        <canvas id="radar" width="400" height="400"></canvas>
    </div>
    <div class="status" id="statusField">Ulanmoqda... <span class="disconnected">● Kutilmoqda</span></div>

    <div class="controls">
        <label>Masshtab: <input type="range" id="zoom" min="0.5" max="3" step="0.1" value="1.2"></label>
    </div>

    <script>
        const canvas = document.getElementById('radar');
        const ctx = canvas.getContext('2d');
        const statusField = document.getElementById('statusField');
        const zoomInput = document.getElementById('zoom');

        const radW = canvas.width;
        const radH = canvas.height;
        const cx = radW / 2;
        const cy = radH / 2;

        async function fetchRadarData() {
            try {
                const res = await fetch('http://127.0.0.1:1337/', { method: 'GET' });
                if (res.ok) {
                    const data = await res.json();
                    statusField.innerHTML = 'Ulanish: <span class="connected">Faol</span>';
                    drawRadar(data);
                }
            } catch (err) {
                statusField.innerHTML = 'Yopiq yoki o\'yin ishlamayapti <span class="disconnected">● Xato</span>';
                ctx.clearRect(0,0, radW, radH);
            }
        }

        function drawRadar(entities) {
            ctx.clearRect(0, 0, radW, radH);

            let localPlayer = entities.find(e => e.local === true);
            if (!localPlayer) return;

            let zoom = parseFloat(zoomInput.value) * 10.0;

            // Markaz - O'yinchining o'zi
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, Math.PI*2);
            ctx.fillStyle = '#00f0ff'; // Yashil-ko'k - biz
            ctx.fill();
            
            // Ko'rish burchagi
            let yawRad = (localPlayer.yaw - 90) * (Math.PI / 180);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(yawRad) * 20, cy + Math.sin(yawRad) * 20);
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Boshqa o'yinchilar
            for (let ent of entities) {
                if (ent.local) continue;

                // Masofa (X va Y CS da biroz teskari, shunga moslaymiz)
                let dx = ent.x - localPlayer.x;
                let dy = localPlayer.y - ent.y; // CS da Y teskari

                // Rotatsiya qilib to'g'irlash ixtiyoriy (bu yerda fixed mapa qilamiz, o'yinchi yaw ga emas)
                let sx = cx + (dx / zoom);
                let sy = cy + (dy / zoom);

                // Dushman yoki Jamoadosh rangi
                if (ent.enemy) {
                    ctx.fillStyle = '#ff3333'; // Qizil
                    ctx.shadowColor = '#ff3333';
                } else {
                    ctx.fillStyle = '#33ff33'; // Yashil
                    ctx.shadowColor = '#33ff33';
                }
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.arc(sx, sy, 5, 0, Math.PI*2);
                ctx.fill();

                ctx.shadowBlur = 0; // O'chirish hp chizish uchun

                // Jon (Health block)
                if (ent.hp) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px Arial';
                    ctx.fillText(ent.hp, sx - 6, sy - 8);
                }
            }
        }

        setInterval(fetchRadarData, 100); // Har 100 milisekundda yangilanadi (10 FPS)
    </script>
</body>
</html>
